name: Zero-Baht Foundation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run foundation tests
        run: python -m unittest discover -s tests -v
      - name: Run autonomous foundation
        run: python -m engine.run
      - name: Persist generated data
        run: |
          git config user.name "zero-baht-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: persist zero-baht run data"
          git push
