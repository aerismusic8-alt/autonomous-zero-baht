name: AX Viral Content Lab — production loop

# Free scheduler. Runs the full pipeline and persists evidence.
# Publishing only happens if the YouTube OAuth secrets are configured;
# otherwise the run produces + QC-checks and stops honestly.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload QC-passed items to YouTube (requires OAuth secrets)"
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC - full production loop
    - cron: "23 18 * * *"  # daily 18:23 UTC - full production loop
    # Posting slots, local UTC+7 -> UTC. One item per platform per slot.
    - cron: "0 2 * * *"    # 09:00 local
    - cron: "0 6 * * *"    # 13:00 local
    - cron: "0 11 * * *"   # 18:00 local
    - cron: "0 14 * * *"   # 21:00 local

permissions:
  contents: write

concurrency:
  group: ax-lab
  cancel-in-progress: false

jobs:
  produce:
    # Full production loop: manual runs + the two daily crons. The four posting
    # slots are handled by the `post` job below.
    if: github.event_name != 'schedule' || startsWith(github.event.schedule, '23 ')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sqlite3 imagemagick fonts-dejavu > /dev/null
          pip install --quiet yt-dlp edge-tts Pillow numpy \
            google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Verify toolchain
        run: |
          ffmpeg -version | head -1
          python -c "import edge_tts, PIL, numpy; print('py deps ok')"

      - name: Market research (public metadata only)
        continue-on-error: true
        run: |
          python pipeline/research.py --label loop --limit 20 --enrich 6 \
            --queries "scary stories shorts" "space facts shorts" \
                      "unsolved mystery shorts" "what if physics shorts" || true
          python pipeline/analyze.py > research/analysis_latest.md || true

      - name: Produce + QC all specs
        run: python pipeline/batch.py --workers 2 --art

      - name: Sync state store
        run: python pipeline/store.py sync

      - name: Publish to every ready platform
        if: ${{ github.event.inputs.publish == 'true' }}
        continue-on-error: true
        env:
          AX_PUBLIC_BASE: ${{ vars.AX_PUBLIC_BASE }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          TIKTOK_CLIENT_JSON: ${{ secrets.TIKTOK_CLIENT_JSON }}
          TIKTOK_TOKEN_JSON: ${{ secrets.TIKTOK_TOKEN_JSON }}
          META_CLIENT_JSON: ${{ secrets.META_CLIENT_JSON }}
          META_TOKEN_JSON: ${{ secrets.META_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          [ -n "$YT_CLIENT_SECRET_JSON" ] && printf '%s' "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json || true
          [ -n "$YT_TOKEN_JSON" ] && printf '%s' "$YT_TOKEN_JSON" > secrets/youtube_token.json || true
          [ -n "$TIKTOK_CLIENT_JSON" ] && printf '%s' "$TIKTOK_CLIENT_JSON" > secrets/tiktok_client.json || true
          [ -n "$TIKTOK_TOKEN_JSON" ] && printf '%s' "$TIKTOK_TOKEN_JSON" > secrets/tiktok_token.json || true
          [ -n "$META_CLIENT_JSON" ] && printf '%s' "$META_CLIENT_JSON" > secrets/meta_client.json || true
          [ -n "$META_TOKEN_JSON" ] && printf '%s' "$META_TOKEN_JSON" > secrets/meta_token.json || true
          python pipeline/multipost.py --status
          python pipeline/multipost.py --all

      - name: Analytics
        continue-on-error: true
        run: python pipeline/analytics.py

      - name: Build status report
        run: python pipeline/report.py

      - name: Persist evidence
        run: |
          git config user.name "ax-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research data content/*/metadata.json content/*/qc_report.json \
                     content/*/thumbnail.png content/batch_summary.json docs/STATUS.md
          git diff --cached --quiet || git commit -m "chore: ax-lab loop evidence $(date -u +%FT%TZ)"
          git push

  # Time-based poster. Runs at the four slots and posts one queued item per
  # ready platform. No-op (honest BLOCKED report) until credentials exist.
  post:
    if: github.event_name == 'schedule' && !startsWith(github.event.schedule, '23 ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Post the due slot
        continue-on-error: true
        env:
          AX_PUBLIC_BASE: ${{ vars.AX_PUBLIC_BASE }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          TIKTOK_CLIENT_JSON: ${{ secrets.TIKTOK_CLIENT_JSON }}
          TIKTOK_TOKEN_JSON: ${{ secrets.TIKTOK_TOKEN_JSON }}
          META_CLIENT_JSON: ${{ secrets.META_CLIENT_JSON }}
          META_TOKEN_JSON: ${{ secrets.META_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          [ -n "$YT_CLIENT_SECRET_JSON" ] && printf '%s' "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json || true
          [ -n "$YT_TOKEN_JSON" ] && printf '%s' "$YT_TOKEN_JSON" > secrets/youtube_token.json || true
          [ -n "$TIKTOK_CLIENT_JSON" ] && printf '%s' "$TIKTOK_CLIENT_JSON" > secrets/tiktok_client.json || true
          [ -n "$TIKTOK_TOKEN_JSON" ] && printf '%s' "$TIKTOK_TOKEN_JSON" > secrets/tiktok_token.json || true
          [ -n "$META_CLIENT_JSON" ] && printf '%s' "$META_CLIENT_JSON" > secrets/meta_client.json || true
          [ -n "$META_TOKEN_JSON" ] && printf '%s' "$META_TOKEN_JSON" > secrets/meta_token.json || true
          python pipeline/schedule.py --tick

      - name: Persist publication evidence
        run: |
          git config user.name "ax-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/STATUS.md
          git diff --cached --quiet || git commit -m "chore: posting evidence $(date -u +%FT%TZ)"
          git push

