name: AX Viral Content Lab — production loop

# Free scheduler. Runs the full pipeline and persists evidence.
# Publishing only happens if the YouTube OAuth secrets are configured;
# otherwise the run produces + QC-checks and stops honestly.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload QC-passed items to YouTube (requires OAuth secrets)"
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC
    - cron: "23 18 * * *"  # daily 18:23 UTC

permissions:
  contents: write

concurrency:
  group: ax-lab
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sqlite3 imagemagick fonts-dejavu > /dev/null
          pip install --quiet yt-dlp edge-tts Pillow numpy \
            google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Verify toolchain
        run: |
          ffmpeg -version | head -1
          python -c "import edge_tts, PIL, numpy; print('py deps ok')"

      - name: Market research (public metadata only)
        continue-on-error: true
        run: |
          python pipeline/research.py --label loop --limit 20 --enrich 6 \
            --queries "scary stories shorts" "space facts shorts" \
                      "unsolved mystery shorts" "what if physics shorts" || true
          python pipeline/analyze.py > research/analysis_latest.md || true

      - name: Produce + QC all specs
        run: python pipeline/batch.py --workers 2

      - name: Sync state store
        run: python pipeline/store.py sync

      - name: Restore YouTube token (if configured)
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > secrets/youtube_client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > secrets/youtube_token.json
          fi

      - name: Publish QC-passed items
        if: ${{ github.event.inputs.publish == 'true' }}
        run: python pipeline/publisher.py --all --privacy private

      - name: Analytics
        continue-on-error: true
        run: python pipeline/analytics.py

      - name: Build status report
        run: python pipeline/report.py

      - name: Persist evidence
        run: |
          git config user.name "ax-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research data content/*/metadata.json content/*/qc_report.json \
                     content/*/thumbnail.png content/batch_summary.json docs/STATUS.md
          git diff --cached --quiet || git commit -m "chore: ax-lab loop evidence $(date -u +%FT%TZ)"
          git push
